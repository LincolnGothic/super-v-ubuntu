name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential debhelper libglib2.0-bin nodejs python3 eslint gjs gir1.2-gtk-4.0 gir1.2-adw-1 lintian
      - name: Validate, test, and build Debian package
        run: make package
      - name: Audit package
        run: |
          lintian --fail-on error,warning ../super-v-ubuntu_0.1.3_all.deb
          dpkg-deb --info ../super-v-ubuntu_0.1.3_all.deb
          dpkg-deb --contents ../super-v-ubuntu_0.1.3_all.deb
          python3 scripts/audit-package.py ../super-v-ubuntu_0.1.3_all.deb
          install -D -m 0644 ../super-v-ubuntu_0.1.3_all.deb artifacts/super-v-ubuntu_0.1.3_all.deb
      - uses: actions/upload-artifact@v4
        with:
          name: super-v-ubuntu-deb
          path: artifacts/super-v-ubuntu_0.1.3_all.deb
          if-no-files-found: error
  shell-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated Shell test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-shell dbus-x11 libgl1-mesa-dri fonts-noto-color-emoji libglib2.0-bin
      - name: Check real popup layout and outside mouse clicks
        run: |
          set -eu
          glib-compile-schemas --strict extension/schemas
          task_session=$(mktemp -d)
          mkdir -p "$task_session/runtime" "$task_session/config" "$task_session/data" "$task_session/cache"
          chmod 700 "$task_session/runtime"
          export XDG_RUNTIME_DIR="$task_session/runtime" XDG_CONFIG_HOME="$task_session/config"
          export XDG_DATA_HOME="$task_session/data" XDG_CACHE_HOME="$task_session/cache"
          export GSETTINGS_BACKEND=memory LIBGL_ALWAYS_SOFTWARE=1
          timeout 90s dbus-run-session -- gnome-shell --headless --wayland --no-x11 \
            --virtual-monitor=1280x960 --mode=user --automation-script="$PWD/tests/shell.test.js" \
            2>&1 | tee shell-test.log
          rg 'SHELL CHECKS COMPLETE' shell-test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shell-ui-log
          path: shell-test.log
          if-no-files-found: ignore
  publish-release:
    needs: [validate-build, shell-ui]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: publish-release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: super-v-ubuntu-deb
          path: artifacts
      - name: Publish verified installer and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          task_version=$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")
          task_tag="v$task_version"
          task_package="super-v-ubuntu_${task_version}_all.deb"
          if gh release view "$task_tag" >/dev/null 2>&1; then
            printf '%s\n' "Release $task_tag already exists; leaving its assets unchanged."
            exit 0
          fi
          (cd artifacts && sha256sum "$task_package" > SHA256SUMS)
          gh release create "$task_tag" "artifacts/$task_package" artifacts/SHA256SUMS \
            --target "$GITHUB_SHA" --title "Super V Ubuntu $task_version" \
            --notes-file docs/release-notes.md
          mkdir release-verify
          gh release download "$task_tag" --dir release-verify \
            --pattern "$task_package" --pattern SHA256SUMS
          (cd release-verify && sha256sum --check SHA256SUMS)
